name: gitleaks

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks incremental scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine log-opts
        id: log_opts
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            # 首次推送到分支:仅扫描 HEAD 一个 commit,避免触发全量扫描
            echo "log_opts=-n 1" >> "$GITHUB_OUTPUT"
          else
            # 增量:仅扫描本次 push 引入的新 commit(排除 merge commit)
            echo "log_opts=--no-merges ${BEFORE_SHA}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Run gitleaks (incremental)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --log-opts="${{ steps.log_opts.outputs.log_opts }}" --no-git
